name: CI Matrix (JDK 17 & 21)

on:
  push:
    branches: [ "main" ]

jobs:
  test-matrix:
    name: Test on Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v5

      - name: Cai dat JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cap quyen cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Chay test voi Gradle
        run: ./gradlew test
